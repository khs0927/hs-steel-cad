name: HS Steel validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/strict-section-catalog-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore
        run: dotnet restore HsSteel.sln
      - name: Build
        run: dotnet build HsSteel.sln -c Release --no-restore
      - name: Test
        run: dotnet test tests/HsSteel.Tests/HsSteel.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
