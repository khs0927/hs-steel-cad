name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dotnet:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore HsSteel.sln
      - run: dotnet build HsSteel.sln -c Release --no-restore
      - run: dotnet test tests/HsSteel.Tests/HsSteel.Tests.csproj -c Release --no-build --logger "console;verbosity=normal"
